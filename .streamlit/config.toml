[theme]
base = "dark"
primaryColor = "#0284C7"
backgroundColor = "#0B0F19"
secondaryBackgroundColor = "#111827"
textColor = "#F9FAFB"
borderColor = "#1F2937"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"

font = "'Inter', sans-serif:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "'JetBrains Mono', monospace:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
baseFontWeight = 400

chartCategoricalColors = ["#0284C7", "#10B981", "#F59E0B", "#8B5CF6", "#EC4899", "#38BDF8", "#6B7280"]

blueColor = "#0284C7"
greenColor = "#10B981"
yellowColor = "#F59E0B"
orangeColor = "#F97316"
redColor = "#EF4444"
violetColor = "#8B5CF6"

[theme.sidebar]
backgroundColor = "#0B0F19"
secondaryBackgroundColor = "#111827"
textColor = "#F9FAFB"
borderColor = "#1F2937"
primaryColor = "#0284C7"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true\n